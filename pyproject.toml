[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notion-automacoes"
version = "0.3.0"
description = "CLI única para operar o Notion no terminal, com tarefas, perfis, app local e MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Felipe Alcantara" }]
keywords = ["notion", "cli", "mcp", "ai", "automation"]
dependencies = [
    "notion-starter>=0.3.0,<0.4.0",
]

[project.optional-dependencies]
app = [
    "notion-workspace-app>=0.3.0,<0.4.0",
]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
    "ruff>=0.4",
]

[project.scripts]
notion-automacoes = "cli.unificada:main"
notion-tasks = "cli.notion_tasks:main"

[project.urls]
Homepage = "https://github.com/Felipe-Alcantara/notion-tasks-cli"
Repository = "https://github.com/Felipe-Alcantara/notion-tasks-cli"

[tool.hatch.build.targets.wheel]
packages = ["cli", "core", "integrations", "services"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
