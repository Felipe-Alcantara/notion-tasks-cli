name: Native binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente a empacotar, por exemplo v0.4.0"
        required: true
        default: "v0.4.0"
        type: string
      publicar_release:
        description: "Publicar os assets na Release após aprovação do ambiente native-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.alvo }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - alvo: windows-x64
            runner: windows-2025
          - alvo: macos-x64
            runner: macos-15-intel
          - alvo: macos-arm64
            runner: macos-14
          - alvo: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout da tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências de build
        run: |
          python -m pip install --upgrade pip
          python -m pip install "." "pyinstaller>=6,<7"

      - name: Construir binário e checksum
        run: >-
          python scripts/build_native.py
          --target "${{ matrix.alvo }}"
          --version "${{ inputs.tag || github.ref_name }}"
          --output dist-native

      - name: Smoke do executável sem importar Python
        run: >-
          python scripts/smoke_native.py
          --executable "dist-native/notion-automacoes-${{ matrix.alvo }}${{ matrix.alvo == 'windows-x64' && '.exe' || '' }}"
          --version "${{ inputs.tag || github.ref_name }}"

      - name: Publicar artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.alvo }}
          path: dist-native/*
          if-no-files-found: error

  publicar:
    name: Anexar assets à Release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publicar_release == true
    runs-on: ubuntu-24.04
    environment: native-release
    permissions:
      contents: write
    steps:
      - name: Baixar todos os artefatos
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true

      - name: Criar ou atualizar Release e anexar assets
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_VERSION: ${{ inputs.tag }}
        run: |
          gh release view "$NATIVE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$NATIVE_VERSION" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "notion-automacoes ${NATIVE_VERSION#v}" --generate-notes
          find release-assets -type f -print0 | xargs -0 gh release upload "$NATIVE_VERSION" \
            --repo "$GITHUB_REPOSITORY" --clobber
